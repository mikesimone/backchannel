# Builds the image exactly as the README says (docker compose from the
# pinned release) and checks that it starts and shows the link QR code.
name: Build
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and start
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: |
          sudo mkdir -p /srv/backchannel
          sudo chown 1000:1000 /srv/backchannel
          printf 'BACKCHANNEL_UID=1000\nBACKCHANNEL_DATA=/srv/backchannel\n' > .env

      - name: Build
        run: docker compose build --progress=plain

      - name: Start
        run: |
          docker compose up -d
          # Wait for the bridge socket, which Signal opens once it's up.
          for i in $(seq 36); do
            docker compose exec -T backchannel sh -c 'ls /data/.config/Signal/external-client/*.sock' && break
            sleep 5
          done

      - name: Link QR code is on screen
        run: |
          # screen.sh qr is what the README has users run; it fails when no
          # QR code decodes. Signal can take a while to show it.
          for i in $(seq 36); do
            if docker compose exec -T backchannel screen.sh qr > qr.txt 2> qr.err; then
              echo "QR code after $((i * 5)) s"
              exit 0
            fi
            sleep 5
          done
          cat qr.err
          exit 1

      - name: Screenshot
        if: always()
        run: docker compose exec -T backchannel screen.sh shot /data/screen.png || true

      - name: Upload screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screen
          path: /srv/backchannel/screen.png

      - name: Logs
        if: always()
        run: docker compose logs --tail 80 || true
